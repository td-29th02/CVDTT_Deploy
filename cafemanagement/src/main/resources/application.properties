spring.application.name=cafe

server.port=8080
# server.servlet.context-path=/cafe
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cafe;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Tuandung2004@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.docker.compose.enabled=false


# Swagger Configuration - Cấu hình tự động cho toàn bộ hệ thống
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.cafe.controllers
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/**
springdoc.group-configs[0].group=cafe-api
springdoc.group-configs[0].packages-to-scan=com.cafe.controllers

# UI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
#springdoc.swagger-ui.filter=true

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_make_it_long_and_secure_at_least_256_bits
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Spring Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN


