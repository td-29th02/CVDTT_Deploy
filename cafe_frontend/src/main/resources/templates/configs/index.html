<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cửa hàng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .config-field {
            margin-bottom: 1rem;
        }
        .field-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.25rem;
        }
        .field-value {
            padding: 0.5rem 0;
            border-bottom: 1px solid transparent;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
        }
        .view-mode .field-value {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.75rem;
        }
        .edit-mode .form-control {
            transition: all 0.3s ease;
        }
        .edit-mode .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .action-buttons {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #dee2e6;
        }
        .btn-edit {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-edit:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        .btn-cancel {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-cancel:hover {
            background-color: #5c636a;
            border-color: #565e64;
        }
        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #0d6efd;
        }
        .config-title {
            color: #0d6efd;
            margin: 0;
        }
        .mode-indicator {
            font-size: 0.875rem;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-weight: 500;
        }
        .mode-view {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .mode-edit {
            background-color: #fff3cd;
            color: #856404;
        }
        .custom-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            max-width: 500px;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }
        .custom-alert.show {
            opacity: 1;
            transform: translateX(0);
        }
        .custom-alert.hide {
            opacity: 0;
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="card p-4 shadow-sm">
                <div class="config-header">
                    <h3 class="config-title">
                        <i class="bi bi-gear-fill me-2"></i>
                        Thông tin cửa hàng
                    </h3>
                    <span id="modeIndicator" class="mode-indicator mode-view">
                        <i class="bi bi-eye me-1"></i>
                        Chế độ xem
                    </span>
                </div>

                <form id="configForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="config-field">
                                <div class="field-label">
                                    <i class="bi bi-shop me-1"></i>
                                    Tên cửa hàng:
                                </div>
                                <div id="storeNameView" class="field-value"></div>
                                <input type="text" class="form-control d-none" id="storeName" name="storeName" required>
                            </div>

                            <div class="config-field">
                                <div class="field-label">
                                    <i class="bi bi-geo-alt me-1"></i>
                                    Địa chỉ:
                                </div>
                                <div id="addressView" class="field-value"></div>
                                <input type="text" class="form-control d-none" id="address" name="address" required>
                            </div>

                            <div class="config-field">
                                <div class="field-label">
                                    <i class="bi bi-telephone me-1"></i>
                                    Điện thoại:
                                </div>
                                <div id="phoneView" class="field-value"></div>
                                <input type="text" class="form-control d-none" id="phone" name="phone" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="config-field">
                                <div class="field-label">
                                    <i class="bi bi-envelope me-1"></i>
                                    Email:
                                </div>
                                <div id="emailView" class="field-value"></div>
                                <input type="email" class="form-control d-none" id="email" name="email" required>
                            </div>

                            <div class="config-field">
                                <div class="field-label">
                                    <i class="bi bi-receipt me-1"></i>
                                    Mã số thuế:
                                </div>
                                <div id="taxCodeView" class="field-value"></div>
                                <input type="text" class="form-control d-none" id="taxCode" name="taxCode" required>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <div id="viewModeButtons" class="d-flex gap-2">
                            <button type="button" id="editBtn" class="btn btn-edit text-white">
                                <i class="bi bi-pencil-square me-1"></i>
                                Chỉnh sửa
                            </button>
                        </div>

                        <div id="editModeButtons" class="d-none gap-2">
                            <button type="submit" class="btn btn-success me-2">
                                <i class="bi bi-check-circle me-1"></i>
                                Lưu thay đổi
                            </button>
                            <button type="button" id="cancelBtn" class="btn btn-cancel text-white">
                                <i class="bi bi-x-circle me-1"></i>
                                Hủy bỏ
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', async function() {
                const configForm = document.getElementById('configForm');
                const editBtn = document.getElementById('editBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const viewModeButtons = document.getElementById('viewModeButtons');
                const editModeButtons = document.getElementById('editModeButtons');
                const modeIndicator = document.getElementById('modeIndicator');
                
                const accessToken = localStorage.getItem('accessToken');
                let originalData = {}; // Store original data for cancel functionality
                let isEditMode = false;

                if (!accessToken) {
                    console.error('Access token not found. Please log in.');
                    showAlert('Vui lòng đăng nhập để xem cấu hình.', 'warning');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                    return;
                }

                // Field mappings
                const fields = [
                    { id: 'storeName', viewId: 'storeNameView' },
                    { id: 'address', viewId: 'addressView' },
                    { id: 'phone', viewId: 'phoneView' },
                    { id: 'email', viewId: 'emailView' },
                    { id: 'taxCode', viewId: 'taxCodeView' }
                ];

                // Function to switch between view and edit modes
                function toggleMode(editMode) {
                    isEditMode = editMode;
                    const container = document.querySelector('.card');
                    
                    if (editMode) {
                        // Switch to edit mode
                        container.classList.remove('view-mode');
                        container.classList.add('edit-mode');
                        viewModeButtons.classList.add('d-none');
                        editModeButtons.classList.remove('d-none');
                        editModeButtons.classList.add('d-flex');
                        modeIndicator.className = 'mode-indicator mode-edit';
                        modeIndicator.innerHTML = '<i class="bi bi-pencil me-1"></i>Chế độ chỉnh sửa';
                        
                        fields.forEach(field => {
                            document.getElementById(field.viewId).classList.add('d-none');
                            document.getElementById(field.id).classList.remove('d-none');
                        });
                    } else {
                        // Switch to view mode
                        container.classList.remove('edit-mode');
                        container.classList.add('view-mode');
                        viewModeButtons.classList.remove('d-none');
                        editModeButtons.classList.add('d-none');
                        editModeButtons.classList.remove('d-flex');
                        modeIndicator.className = 'mode-indicator mode-view';
                        modeIndicator.innerHTML = '<i class="bi bi-eye me-1"></i>Chế độ xem';
                        
                        fields.forEach(field => {
                            document.getElementById(field.viewId).classList.remove('d-none');
                            document.getElementById(field.id).classList.add('d-none');
                        });
                    }
                }

                // Function to update display values
                function updateDisplayValues(data) {
                    fields.forEach(field => {
                        const value = data[field.id.replace(/([A-Z])/g, '$1').toLowerCase().replace(/^(.)/, (match, p1) => p1.toLowerCase())] || data[field.id] || '';
                        document.getElementById(field.viewId).textContent = value || 'Chưa cấu hình';
                        document.getElementById(field.id).value = value;
                    });
                }

                // Function to fetch configuration
                async function fetchConfig() {
                    try {
                        const response = await fetch('http://localhost:8080/api/v1/config', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${accessToken}`
                            }
                        });

                        if (response.ok) {
                            const apiResult = await response.json();
                            if (apiResult) {
                                originalData = {
                                    storeName: apiResult.storeName || '',
                                    address: apiResult.address || '',
                                    phone: apiResult.phone || '',
                                    email: apiResult.email || '',
                                    taxCode: apiResult.taxCode || ''
                                };
                                updateDisplayValues(originalData);
                            } else {
                                console.error('API returned an error or no data:', apiResult.message);
                                showAlert(apiResult.message || 'Không có dữ liệu cấu hình', 'info');
                            }
                        } else {
                            const errorData = await response.json().catch(() => ({ message: 'Lỗi không xác định' }));
                            console.error('Failed to fetch config:', response.status, errorData);
                            
                            // Sử dụng userMessage từ API nếu có
                            const errorMessage = errorData.userMessage || 'Lỗi không xác định';
                            showAlert(`Lỗi khi tải cấu hình: ${errorMessage}`, 'danger');
                            
                            if (response.status === 401) {
                                showAlert('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
                                setTimeout(() => {
                                    window.location.href = '/login';
                                }, 2000);
                            } 
                        }
                    } catch (error) {
                        console.error('Error fetching config:', error);
                        showAlert('Có lỗi xảy ra khi tải dữ liệu cấu hình.', 'danger');
                    }
                }

                // Edit button click handler
                editBtn.addEventListener('click', function() {
                    toggleMode(true);
                });

                // Cancel button click handler
                cancelBtn.addEventListener('click', function() {
                    // Restore original values
                    updateDisplayValues(originalData);
                    toggleMode(false);
                });

                // Handle form submission for updating configuration
                configForm.addEventListener('submit', async function(event) {
                    event.preventDefault();

                    const configData = {
                        storeName: document.getElementById('storeName').value,
                        address: document.getElementById('address').value,
                        phone: document.getElementById('phone').value,
                        email: document.getElementById('email').value,
                        taxCode: document.getElementById('taxCode').value
                    };

                    try {
                        const response = await fetch('http://localhost:8080/api/v1/config', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${accessToken}`
                            },
                            body: JSON.stringify(configData)
                        });

                        if (response.ok) {
                            const apiResult = await response.json();
                            if (apiResult) {
                                showAlert('Cấu hình đã được lưu thành công!', 'success');
                                originalData = { ...configData };
                                updateDisplayValues(originalData);
                                toggleMode(false);
                            } else {
                                console.error('API returned an error:', apiResult.message);
                                const errorMessage = apiResult.userMessage || apiResult.message || 'Lỗi không xác định';
                                showAlert(`Đã có lỗi xảy ra: ${errorMessage}`, 'danger');
                            }
                        } else {
                            const errorData = await response.json().catch(() => ({ message: 'Lỗi không xác định' }));
                            console.error('Failed to update config:', response.status, errorData);
                            
                            // Sử dụng userMessage từ API nếu có
                            const errorMessage = errorData.userMessage || errorData.message || 'Lỗi không xác định';
                            showAlert(`Lỗi khi lưu cấu hình: ${errorMessage}`, 'danger');
                            
                            if (response.status === 401) {
                                showAlert('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
                                setTimeout(() => {
                                    window.location.href = '/login';
                                }, 2000);
                            } else if (response.status === 403) {
                                // Chỉ hiển thị thông báo lỗi, không chuyển hướng
                                // Để người dùng ở lại trang hiện tại
                            }
                        }
                    } catch (error) {
                        console.error('Error updating config:', error);
                        showAlert('Có lỗi xảy ra khi lưu dữ liệu cấu hình.', 'danger');
                    }
                });

                // Improved alert function with animation
                function showAlert(message, type) {
                    // Remove existing alerts
                    const existingAlerts = document.querySelectorAll('.custom-alert');
                    existingAlerts.forEach(alert => {
                        alert.classList.add('hide');
                        setTimeout(() => {
                            if (alert.parentNode) {
                                alert.parentNode.removeChild(alert);
                            }
                        }, 300);
                    });

                    // Create new alert
                    const alertDiv = document.createElement('div');
                    alertDiv.className = `alert alert-${type} alert-dismissible custom-alert`;
                    
                    // Icon mapping
                    const iconMap = {
                        'success': 'bi-check-circle-fill',
                        'danger': 'bi-exclamation-triangle-fill',
                        'warning': 'bi-exclamation-triangle-fill',
                        'info': 'bi-info-circle-fill'
                    };
                    
                    const icon = iconMap[type] || 'bi-info-circle-fill';
                    
                    alertDiv.innerHTML = `
                        <div class="d-flex align-items-center">
                            <i class="bi ${icon} me-2"></i>
                            <div class="flex-grow-1">${message}</div>
                            <button type="button" class="btn-close ms-2" aria-label="Close"></button>
                        </div>
                    `;
                    
                    document.body.appendChild(alertDiv);

                    // Show animation
                    setTimeout(() => {
                        alertDiv.classList.add('show');
                    }, 100);

                    // Auto hide after 5 seconds
                    const autoHideTimer = setTimeout(() => {
                        hideAlert(alertDiv);
                    }, 5000);

                    // Close button handler
                    const closeBtn = alertDiv.querySelector('.btn-close');
                    closeBtn.addEventListener('click', () => {
                        clearTimeout(autoHideTimer);
                        hideAlert(alertDiv);
                    });
                }

                function hideAlert(alertDiv) {
                    alertDiv.classList.remove('show');
                    alertDiv.classList.add('hide');
                    setTimeout(() => {
                        if (alertDiv.parentNode) {
                            alertDiv.parentNode.removeChild(alertDiv);
                        }
                    }, 300);
                }

                // Initialize page
                toggleMode(false);
                fetchConfig();
            });
        </script>
    </th:block>
</body>
</html>
