<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-0">
        <div class="container">
            <a class="navbar-brand py-0" href="/home">Cafe Management</a>
            <button class="navbar-toggler py-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link py-0" href="/home"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link py-0" href="/drink"><i class="bi bi-cup-straw"></i> Đồ uống</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link py-0" href="/topping"><i class="bi bi-cup-hot"></i> Topping</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link py-0" href="#"><i class="bi bi-cart"></i> Sản phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link py-0" href="/user"><i class="bi bi-people me-2"></i>Người dùng</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle py-0" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                            <span id="userDisplayName">Guest</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end p-1" style="min-width: auto;">
                            <li>
                                <a class="dropdown-item px-2 py-1" href="/config">
                                    <i class="bi bi-gear"></i> Cài đặt
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li>
                                <a class="dropdown-item px-2 py-1" href="#" onclick="handleLogout()">
                                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                                </a>
                            </li>
                        </ul>                        
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div layout:fragment="content">
            <!-- Content will be inserted here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('username');
            window.location.href = '/login';
        }

        // Hiển thị username khi trang được tải
        document.addEventListener('DOMContentLoaded', function () {
            const username = localStorage.getItem('username');
            if (username) {
                document.getElementById('userDisplayName').textContent = username;
            }
        });
    </script>
    <th:block layout:fragment="scripts">
        <!-- Page specific scripts will be inserted here -->
    </th:block>
</body>

</html>
