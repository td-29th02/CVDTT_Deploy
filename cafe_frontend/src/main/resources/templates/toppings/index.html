<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Topping</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .action-btn {
            margin: 0 2px;
            padding: 5px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .btn-edit {
            background: #28a745;
            color: white;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 600;
            margin: 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid #0d6efd;
        }

        .badge-status {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .header-section {
            margin-bottom: 2rem;
        }

        .search-add-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .price-text {
            font-weight: bold;
            color: #28a745;
        }

        .topping-description {
            color: #6c757d;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Custom Delete Confirmation Modal Styles */
        .modal-content {
            border-radius: 10px;
            border: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 10px 10px 0 0;
        }

        .modal-footer {
            border-top: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 0 0 10px 10px;
        }

        .btn-confirm-delete {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .btn-confirm-delete:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .topping-icon {
            font-size: 1.2rem;
            margin-right: 0.5rem;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="card p-4 shadow-sm">
                <!-- Page Title -->
                <div class="header-section">
                    <h3 class="page-title">
                        <i class="bi bi-plus-circle-dotted topping-icon"></i>Quản lý Topping
                    </h3>
                </div>

                <!-- Search and Add Section -->
                <div class="search-add-section">
                    <div class="row align-items-center mb-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="searchInput"
                                    placeholder="Tìm kiếm theo tên topping...">
                            </div>
                        </div>
                        <div class="col-md-6 text-end">
                            <button class="btn btn-primary" onclick="showAddToppingModal()">
                                <i class="bi bi-plus-circle me-2"></i>Thêm mới
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Toppings Table -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>STT</th>
                                    <th>Tên topping</th>
                                    <th>Giá</th>
                                    <th>Trạng thái</th>
                                    <th width="150">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="toppingTableBody">
                                <tr>
                                    <td colspan="5" class="text-center py-4">
                                        <div class="loading-spinner me-2"></div>
                                        Đang tải dữ liệu...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-end mt-4">
                    <nav aria-label="Topping pagination">
                        <ul class="pagination" id="pagination">
                            <!-- Pagination will be generated here -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Add/Edit Topping Modal -->
        <div class="modal fade" id="toppingModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="toppingModalTitle">Thêm topping mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="toppingForm">
                            <input type="hidden" id="toppingId">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="toppingName" class="form-label">Tên topping *</label>
                                        <input type="text" class="form-control" id="toppingName" required
                                            placeholder="Ví dụ: Milk, Sugar, Duong...">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="toppingPrice" class="form-label">Giá (VNĐ) *</label>
                                        <input type="number" class="form-control" id="toppingPrice" min="0" required
                                            placeholder="Ví dụ: 5000, 7000...">
                                        <small class="form-text text-muted">Nhập giá của topping (đơn vị: VNĐ)</small>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label class="form-label">Trạng thái</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="isActive" checked>
                                            <label class="form-check-label" for="isActive">
                                                Hoạt động
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveTopping()">
                            <i class="bi bi-check-circle me-2"></i>Lưu
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Delete Confirmation Modal -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-exclamation-triangle text-warning me-2"></i>
                            Xác nhận xóa
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-3">Bạn có chắc chắn muốn xóa topping này không?</p>
                        <div class="alert alert-warning">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Lưu ý:</strong> Hành động này không thể hoàn tác!
                        </div>
                        <div id="toppingToDeleteInfo" class="bg-light p-3 rounded">
                            <!-- Topping info will be displayed here -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="button" class="btn btn-confirm-delete" id="confirmDeleteBtn">
                            <i class="bi bi-trash me-2"></i>Xóa topping
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            let allToppings = [];
            let filteredToppings = [];
            let currentPage = 1;
            const toppingsPerPage = 10;
            let toppingToDeleteId = null;

            // Initialize page
            document.addEventListener('DOMContentLoaded', function () {
                loadToppings();
                setupSearchAndFilter();
            });

            // Load toppings from API
            async function loadToppings() {
                const accessToken = localStorage.getItem('accessToken');

                if (!accessToken) {
                    showAlert('Vui lòng đăng nhập để xem danh sách topping.', 'warning');
                    setTimeout(() => window.location.href = '/login', 2000);
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8080/api/v1/toppings', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        }
                    });

                    if (response.ok) {
                        const apiResult = await response.json();
                        if (apiResult.status && apiResult.data) {
                            allToppings = apiResult.data;
                            filteredToppings = [...allToppings];
                            applyFilters();
                        } else {
                            showAlert(apiResult.userMessage || apiResult.message || 'Không có dữ liệu topping',
                                'info');
                            renderEmptyTable();
                        }
                    } else {
                        await handleErrorResponse(response);
                    }
                } catch (error) {
                    console.error('Error loading toppings:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                    renderEmptyTable();
                }
            }

            // Render toppings table
            function renderToppings() {
                const toppingTableBody = document.getElementById('toppingTableBody');
                const startIndex = (currentPage - 1) * toppingsPerPage;
                const endIndex = startIndex + toppingsPerPage;
                const currentToppings = filteredToppings.slice(startIndex, endIndex);

                if (currentToppings.length === 0) {
                    renderEmptyTable();
                    return;
                }

                toppingTableBody.innerHTML = currentToppings.map((topping, index) => `
                    <tr>
                        <td>${startIndex + index + 1}</td>
                        <td>
                            <div>
                                <strong><i class="bi bi-circle-fill me-2" style="color: #17a2b8; font-size: 0.8rem;"></i>${topping.name}</strong>
                            </div>
                        </td>
                        <td>
                            <span class="price-text">${formatPrice(topping.price)}</span>
                        </td>
                        <td>
                            <span class="badge ${getStatusBadgeClass(topping.isActive)} badge-status">
                                ${topping.isActive ? 'Đang bán' : 'Hết hàng'}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editTopping(${topping.id})" title="Chỉnh sửa">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="action-btn btn-delete" onclick="showDeleteConfirmModal(${topping.id})" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            function renderEmptyTable() {
                const toppingTableBody = document.getElementById('toppingTableBody');
                toppingTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4">
                            <i class="bi bi-plus-circle-dotted text-muted" style="font-size: 2rem;"></i>
                            <p class="text-muted mt-2">Không có topping nào</p>
                        </td>
                    </tr>
                `;
            }

            // Helper functions
            function getStatusBadgeClass(isActive) {
                return isActive ? 'bg-success' : 'bg-secondary';
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND'
                }).format(price);
            }

            // Search and filter
            function setupSearchAndFilter() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', applyFilters);
            }

            function applyFilters() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();

                filteredToppings = allToppings.filter(topping => {
                    const matchesSearch = topping.name.toLowerCase().includes(searchTerm);
                    return matchesSearch;
                });

                currentPage = 1;
                renderToppings();
                renderPagination();
            }

            // Pagination
            function renderPagination() {
                const totalPages = Math.ceil(filteredToppings.length / toppingsPerPage);
                const pagination = document.getElementById('pagination');

                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                let paginationHTML = '';

                // Previous button
                if (currentPage > 1) {
                    paginationHTML +=
                        `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Trước</a></li>`;
                }

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        paginationHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                    } else {
                        paginationHTML +=
                            `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${i})">${i}</a></li>`;
                    }
                }

                // Next button
                if (currentPage < totalPages) {
                    paginationHTML +=
                        `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Sau</a></li>`;
                }

                pagination.innerHTML = paginationHTML;
            }

            function goToPage(page) {
                currentPage = page;
                renderToppings();
                renderPagination();
            }

            // Modal functions
            function showAddToppingModal() {
                document.getElementById('toppingModalTitle').textContent = 'Thêm topping mới';
                document.getElementById('toppingForm').reset();
                document.getElementById('toppingId').value = '';
                document.getElementById('isActive').checked = true;
                new bootstrap.Modal(document.getElementById('toppingModal')).show();
            }

            function editTopping(toppingId) {
                const topping = allToppings.find(t => t.id === toppingId);
                if (!topping) return;

                document.getElementById('toppingModalTitle').textContent = 'Chỉnh sửa topping';
                document.getElementById('toppingId').value = topping.id;
                document.getElementById('toppingName').value = topping.name;
                document.getElementById('toppingPrice').value = topping.price;
                document.getElementById('isActive').checked = topping.isActive;

                new bootstrap.Modal(document.getElementById('toppingModal')).show();
            }

            // Custom delete confirmation modal
            function showDeleteConfirmModal(toppingId) {
                const topping = allToppings.find(t => t.id === toppingId);
                if (!topping) return;

                toppingToDeleteId = toppingId;

                // Update topping info in modal (không hiển thị mô tả)
                document.getElementById('toppingToDeleteInfo').innerHTML = `
                    <strong>Tên topping:</strong> ${topping.name}<br>
                    <strong>Giá:</strong> ${formatPrice(topping.price)}<br>
                    <strong>Trạng thái:</strong> ${topping.isActive ? 'Đang bán' : 'Hết hàng'}
                `;

                // Setup confirm button click handler
                document.getElementById('confirmDeleteBtn').onclick = function () {
                    performDeleteTopping(toppingToDeleteId);
                };

                new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
            }

            // API functions
            async function saveTopping() {
                const toppingId = document.getElementById('toppingId').value;
                const isEdit = !!toppingId;

                const toppingData = {
                    name: document.getElementById('toppingName').value.trim(),
                    price: parseInt(document.getElementById('toppingPrice').value),
                    isActive: document.getElementById('isActive').checked
                };

                // Validation
                if (!toppingData.name) {
                    showAlert('Vui lòng nhập tên topping', 'warning');
                    return;
                }

                if (!toppingData.price || toppingData.price <= 0) {
                    showAlert('Vui lòng nhập giá hợp lệ', 'warning');
                    return;
                }

                try {
                    const url = isEdit ? `http://localhost:8080/api/v1/toppings/${toppingId}` :
                        'http://localhost:8080/api/v1/toppings';
                    const method = isEdit ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        },
                        body: JSON.stringify(toppingData)
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        showAlert(apiResult.userMessage || 'Lưu topping thành công', 'success');
                        bootstrap.Modal.getInstance(document.getElementById('toppingModal')).hide();
                        loadToppings();
                    } else {
                        showAlert(apiResult.userMessage || 'Có lỗi xảy ra khi lưu topping', 'danger');
                    }
                } catch (error) {
                    console.error('Error saving topping:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            async function performDeleteTopping(toppingId) {
                try {
                    const response = await fetch(`http://localhost:8080/api/v1/toppings/${toppingId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        }
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        showAlert(apiResult.userMessage || 'Xóa topping thành công', 'success');
                        bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                        loadToppings();
                    } else {
                        showAlert(apiResult.userMessage || 'Không thể xóa topping', 'danger');
                    }
                } catch (error) {
                    console.error('Error deleting topping:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            // Utility functions
            function showAlert(message, type) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
                alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                document.body.appendChild(alertDiv);

                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 5000);
            }

            async function handleErrorResponse(response) {
                let errorData = {
                    message: 'Lỗi không xác định'
                };

                try {
                    errorData = await response.json();
                } catch (e) {
                    console.log('Could not parse error response');
                }

                switch (response.status) {
                    case 401:
                        localStorage.removeItem('accessToken');
                        showAlert(errorData.userMessage || errorData.message ||
                            'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
                        setTimeout(() => window.location.href = '/login', 2000);
                        break;
                    case 403:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Bạn không có quyền truy cập.',
                            'danger');
                        break;
                    case 404:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'API endpoint không tồn tại.',
                            'danger');
                        break;
                    case 500:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Lỗi server nội bộ.', 'danger');
                        break;
                    default:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Có lỗi xảy ra', 'danger');
                }
            }
        </script>
    </th:block>
</body>

</html>
