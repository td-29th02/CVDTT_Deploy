<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đồ uống</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .action-btn {
            margin: 0 2px;
            padding: 5px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .btn-edit {
            background: #28a745;
            color: white;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 600;
            margin: 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid #0d6efd;
        }

        .badge-type {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
        }

        .badge-status {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .header-section {
            margin-bottom: 2rem;
        }

        .search-add-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-buttons .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .caffeine-stars {
            color: #ffc107;
        }

        .price-text {
            font-weight: bold;
            color: #28a745;
        }

        .drink-description {
            color: #6c757d;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Custom Delete Confirmation Modal Styles */
        .modal-content {
            border-radius: 10px;
            border: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 10px 10px 0 0;
        }

        .modal-footer {
            border-top: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 0 0 10px 10px;
        }

        .btn-confirm-delete {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .btn-confirm-delete:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="card p-4 shadow-sm">
                <!-- Page Title -->
                <div class="header-section">
                    <h3 class="page-title">
                        <i class="bi bi-cup-straw"></i>Quản lý Đồ uống
                    </h3>
                </div>

                <!-- Search and Filter Section -->
                <div class="search-add-section">
                    <div class="row align-items-center mb-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="searchInput"
                                    placeholder="Tìm kiếm theo tên đồ uống...">
                            </div>
                        </div>
                        <div class="col-md-6 text-end">
                            <button class="btn btn-primary" onclick="showAddDrinkModal()">
                                <i class="bi bi-plus-circle me-2"></i>Thêm mới
                            </button>
                        </div>
                    </div>

                    <!-- Filter Buttons -->
                    <div class="filter-buttons">
                        <button class="btn btn-outline-secondary active" onclick="filterByType('ALL')" id="filterAll">
                            <i class="bi bi-list me-1"></i>Tất cả
                        </button>
                        <button class="btn btn-outline-warning" onclick="filterByType('Coffee')" id="filterCoffee">
                            <i class="bi bi-cup-hot me-1"></i>Coffee
                        </button>
                        <button class="btn btn-outline-success" onclick="filterByType('Tea')" id="filterTea">
                            <i class="bi bi-cup-straw me-1"></i>Tea
                        </button>
                    </div>
                </div>

                <!-- Drinks Table -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>STT</th>
                                    <th>Tên đồ uống</th>
                                    <th>Loại</th>
                                    <th>Giá</th>
                                    <th>Độ caffeine</th>
                                    <th>Xuất xứ</th>
                                    <th>Trạng thái</th>
                                    <th width="150">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="drinkTableBody">
                                <tr>
                                    <td colspan="8" class="text-center py-4">
                                        <div class="loading-spinner me-2"></div>
                                        Đang tải dữ liệu...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-end mt-4">
                    <nav aria-label="Drink pagination">
                        <ul class="pagination" id="pagination">
                            <!-- Pagination will be generated here -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Add/Edit Drink Modal -->
        <div class="modal fade" id="drinkModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="drinkModalTitle">Thêm đồ uống mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="drinkForm">
                            <input type="hidden" id="drinkId">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="drinkName" class="form-label">Tên đồ uống *</label>
                                        <input type="text" class="form-control" id="drinkName" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="drinkType" class="form-label">Loại *</label>
                                        <select class="form-select" id="drinkType" required>
                                            <option value="">Chọn loại đồ uống</option>
                                            <option value="Coffee">Coffee</option>
                                            <option value="Tea">Tea</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="basePrice" class="form-label">Giá cơ bản (VNĐ) *</label>
                                        <input type="number" class="form-control" id="basePrice" min="0" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="origin" class="form-label">Xuất xứ</label>
                                        <input type="text" class="form-control" id="origin"
                                            placeholder="Ví dụ: Việt Nam, Colombia...">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="brewingMethod" class="form-label">Phương pháp pha chế</label>
                                        <input type="text" class="form-control" id="brewingMethod"
                                            placeholder="Ví dụ: Pha che don gian, Espresso...">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="caffeineLevel" class="form-label">Độ caffeine (0-4)</label>
                                        <select class="form-select" id="caffeineLevel">
                                            <option value="0">0 - Không caffeine</option>
                                            <option value="1">1 - Ít caffeine</option>
                                            <option value="2">2 - Trung bình</option>
                                            <option value="3">3 - Nhiều caffeine</option>
                                            <option value="4">4 - Rất nhiều caffeine</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label for="description" class="form-label">Mô tả</label>
                                        <textarea class="form-control" id="description" rows="3"
                                            placeholder="Mô tả về đồ uống..."></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Trạng thái</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="isActive" checked>
                                            <label class="form-check-label" for="isActive">
                                                Hoạt động
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveDrink()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Delete Confirmation Modal -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-exclamation-triangle text-warning me-2"></i>
                            Xác nhận xóa
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-3">Bạn có chắc chắn muốn xóa đồ uống này không?</p>
                        <div class="alert alert-warning">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Lưu ý:</strong> Hành động này không thể hoàn tác!
                        </div>
                        <div id="drinkToDeleteInfo" class="bg-light p-3 rounded">
                            <!-- Drink info will be displayed here -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="button" class="btn btn-confirm-delete" id="confirmDeleteBtn">
                            <i class="bi bi-trash me-2"></i>Xóa đồ uống
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            let allDrinks = [];
            let filteredDrinks = [];
            let currentPage = 1;
            const drinksPerPage = 10;
            let drinkToDeleteId = null;
            let currentTypeFilter = 'ALL';

            // Initialize page
            document.addEventListener('DOMContentLoaded', function () {
                loadDrinks();
                setupSearchAndFilter();
            });

            // Load drinks from API
            async function loadDrinks() {
                const accessToken = localStorage.getItem('accessToken');

                if (!accessToken) {
                    showAlert('Vui lòng đăng nhập để xem danh sách đồ uống.', 'warning');
                    setTimeout(() => window.location.href = '/login', 2000);
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8080/api/v1/drinks', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        }
                    });

                    if (response.ok) {
                        const apiResult = await response.json();
                        if (apiResult.status && apiResult.data) {
                            allDrinks = apiResult.data;
                            filteredDrinks = [...allDrinks];
                            applyFilters();
                        } else {
                            showAlert(apiResult.userMessage || apiResult.message || 'Không có dữ liệu đồ uống',
                                'info');
                            renderEmptyTable();
                        }
                    } else {
                        await handleErrorResponse(response);
                    }
                } catch (error) {
                    console.error('Error loading drinks:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                    renderEmptyTable();
                }
            }

            // Render drinks table
            function renderDrinks() {
                const drinkTableBody = document.getElementById('drinkTableBody');
                const startIndex = (currentPage - 1) * drinksPerPage;
                const endIndex = startIndex + drinksPerPage;
                const currentDrinks = filteredDrinks.slice(startIndex, endIndex);

                if (currentDrinks.length === 0) {
                    renderEmptyTable();
                    return;
                }

                drinkTableBody.innerHTML = currentDrinks.map((drink, index) => `
                    <tr>
                        <td>${startIndex + index + 1}</td>
                        <td>
                            <div>
                                <strong>${drink.name}</strong>
                                ${drink.description ? `<br><small class="drink-description">${drink.description}</small>` : ''}
                            </div>
                        </td>
                        <td>
                            <span class="badge ${getTypeBadgeClass(drink.type)} badge-type">
                                ${drink.type}
                            </span>
                        </td>
                        <td>
                            <span class="price-text">${formatPrice(drink.basePrice)}</span>
                        </td>
                        <td>
                            <div class="caffeine-stars">
                                ${generateCaffeineStars(drink.caffeineLevel || 0)}
                            </div>
                        </td>
                        <td>${drink.origin || 'N/A'}</td>
                        <td>
                            <span class="badge ${getStatusBadgeClass(drink.isActive)} badge-status">
                                ${drink.isActive ? 'Đang bán' : 'Hết hàng'}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editDrink(${drink.id})" title="Chỉnh sửa">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="action-btn btn-delete" onclick="showDeleteConfirmModal(${drink.id})" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            function renderEmptyTable() {
                const drinkTableBody = document.getElementById('drinkTableBody');
                drinkTableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-4">
                            <i class="bi bi-cup text-muted" style="font-size: 2rem;"></i>
                            <p class="text-muted mt-2">Không có đồ uống nào</p>
                        </td>
                    </tr>
                `;
            }

            // Helper functions
            function getTypeBadgeClass(type) {
                const classes = {
                    'Coffee': 'bg-warning text-dark',
                    'Tea': 'bg-success'
                };
                return classes[type] || 'bg-secondary';
            }

            function getStatusBadgeClass(isActive) {
                return isActive ? 'bg-success' : 'bg-secondary';
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND'
                }).format(price);
            }

            function generateCaffeineStars(level) {
                const maxStars = 4;
                let stars = '';
                for (let i = 0; i < maxStars; i++) {
                    if (i < level) {
                        stars += '<i class="bi bi-circle-fill"></i>';
                    } else {
                        stars += '<i class="bi bi-circle"></i>';
                    }
                }
                return stars;
            }

            // Search and filter
            function setupSearchAndFilter() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', applyFilters);
            }

            function filterByType(type) {
                currentTypeFilter = type;
                currentPage = 1;

                // Update active button
                document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                if (type === 'ALL') {
                    document.getElementById('filterAll').classList.add('active');
                } else if (type === 'Coffee') {
                    document.getElementById('filterCoffee').classList.add('active');
                } else if (type === 'Tea') {
                    document.getElementById('filterTea').classList.add('active');
                }

                applyFilters();
            }

            function applyFilters() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();

                filteredDrinks = allDrinks.filter(drink => {
                    const matchesSearch = drink.name.toLowerCase().includes(searchTerm);
                    const matchesType = currentTypeFilter === 'ALL' || drink.type === currentTypeFilter;
                    return matchesSearch && matchesType;
                });

                currentPage = 1;
                renderDrinks();
                renderPagination();
            }

            // Pagination
            function renderPagination() {
                const totalPages = Math.ceil(filteredDrinks.length / drinksPerPage);
                const pagination = document.getElementById('pagination');

                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                let paginationHTML = '';

                // Previous button
                if (currentPage > 1) {
                    paginationHTML +=
                        `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Trước</a></li>`;
                }

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        paginationHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                    } else {
                        paginationHTML +=
                            `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${i})">${i}</a></li>`;
                    }
                }

                // Next button
                if (currentPage < totalPages) {
                    paginationHTML +=
                        `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Sau</a></li>`;
                }

                pagination.innerHTML = paginationHTML;
            }

            function goToPage(page) {
                currentPage = page;
                renderDrinks();
                renderPagination();
            }

            // Modal functions
            function showAddDrinkModal() {
                document.getElementById('drinkModalTitle').textContent = 'Thêm đồ uống mới';
                document.getElementById('drinkForm').reset();
                document.getElementById('drinkId').value = '';
                document.getElementById('caffeineLevel').value = '0';
                document.getElementById('isActive').checked = true;
                new bootstrap.Modal(document.getElementById('drinkModal')).show();
            }

            function editDrink(drinkId) {
                const drink = allDrinks.find(d => d.id === drinkId);
                if (!drink) return;

                document.getElementById('drinkModalTitle').textContent = 'Chỉnh sửa đồ uống';
                document.getElementById('drinkId').value = drink.id;
                document.getElementById('drinkName').value = drink.name;
                document.getElementById('drinkType').value = drink.type;
                document.getElementById('basePrice').value = drink.basePrice;
                document.getElementById('description').value = drink.description || '';
                document.getElementById('origin').value = drink.origin || '';
                document.getElementById('brewingMethod').value = drink.brewingMethod || '';
                document.getElementById('caffeineLevel').value = drink.caffeineLevel || 0;
                document.getElementById('isActive').checked = drink.isActive !== false;

                new bootstrap.Modal(document.getElementById('drinkModal')).show();
            }

            // Custom delete confirmation modal
            function showDeleteConfirmModal(drinkId) {
                const drink = allDrinks.find(d => d.id === drinkId);
                if (!drink) return;

                drinkToDeleteId = drinkId;

                // Update drink info in modal
                document.getElementById('drinkToDeleteInfo').innerHTML = `
                    <strong>Tên đồ uống:</strong> ${drink.name}<br>
                    <strong>Loại:</strong> ${drink.type}<br>
                    <strong>Giá:</strong> ${formatPrice(drink.basePrice)}<br>
                    <strong>Mô tả:</strong> ${drink.description || 'Không có mô tả'}
                `;

                // Setup confirm button click handler
                document.getElementById('confirmDeleteBtn').onclick = function () {
                    performDeleteDrink(drinkToDeleteId);
                };

                new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
            }

            // API functions
            async function saveDrink() {
                const drinkId = document.getElementById('drinkId').value;
                const isEdit = !!drinkId;

                const drinkData = {
                    name: document.getElementById('drinkName').value,
                    type: document.getElementById('drinkType').value,
                    basePrice: parseInt(document.getElementById('basePrice').value),
                    description: document.getElementById('description').value || null,
                    origin: document.getElementById('origin').value || null,
                    brewingMethod: document.getElementById('brewingMethod').value || null,
                    caffeineLevel: parseInt(document.getElementById('caffeineLevel').value) || 0,
                    isActive: document.getElementById('isActive').checked
                };

                try {
                    const url = isEdit ? `http://localhost:8080/api/v1/drinks/${drinkId}` :
                        'http://localhost:8080/api/v1/drinks';
                    const method = isEdit ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        },
                        body: JSON.stringify(drinkData)
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        showAlert(apiResult.userMessage || 'Lưu đồ uống thành công', 'success');
                        bootstrap.Modal.getInstance(document.getElementById('drinkModal')).hide();
                        loadDrinks();
                    } else {
                        showAlert(apiResult.userMessage || 'Có lỗi xảy ra khi lưu đồ uống', 'danger');
                    }
                } catch (error) {
                    console.error('Error saving drink:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            async function performDeleteDrink(drinkId) {
                try {
                    const response = await fetch(`http://localhost:8080/api/v1/drinks/${drinkId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        }
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        showAlert(apiResult.userMessage || 'Xóa đồ uống thành công', 'success');
                        bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                        loadDrinks();
                    } else {
                        showAlert(apiResult.userMessage || 'Không thể xóa đồ uống', 'danger');
                    }
                } catch (error) {
                    console.error('Error deleting drink:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            // Utility functions
            function showAlert(message, type) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
                alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                document.body.appendChild(alertDiv);

                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 5000);
            }

            async function handleErrorResponse(response) {
                let errorData = {
                    message: 'Lỗi không xác định'
                };

                try {
                    errorData = await response.json();
                } catch (e) {
                    console.log('Could not parse error response');
                }

                switch (response.status) {
                    case 401:
                        localStorage.removeItem('accessToken');
                        showAlert(errorData.userMessage || errorData.message ||
                            'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
                        setTimeout(() => window.location.href = '/login', 2000);
                        break;
                    case 403:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Bạn không có quyền truy cập.',
                            'danger');
                        break;
                    case 404:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'API endpoint không tồn tại.',
                            'danger');
                        break;
                    case 500:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Lỗi server nội bộ.', 'danger');
                        break;
                    default:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Có lỗi xảy ra', 'danger');
                }
            }
        </script>
    </th:block>
</body>

</html>
