<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .action-btn {
            margin: 0 2px;
            padding: 5px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            transform: translateY(-1px);
        }
        .btn-edit { background: #28a745; color: white; }
        .btn-edit:hover { background: #218838; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }
        .btn-password { background: #ffc107; color: #212529; }
        .btn-password:hover { background: #e0a800; }
        
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .page-title {
            color: #0d6efd;
            font-weight: 600;
            margin: 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid #0d6efd;
        }
        
        .badge-role {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header-section {
            margin-bottom: 2rem;
        }
        
        .search-add-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Custom Delete Confirmation Modal Styles */
        .modal-content {
            border-radius: 10px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .modal-header {
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 10px 10px 0 0;
        }
        
        .modal-footer {
            border-top: 1px solid #dee2e6;
            background-color: #f8f9fa;
            border-radius: 0 0 10px 10px;
        }
        
        .btn-confirm-delete {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        
        .btn-confirm-delete:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="card p-4 shadow-sm">
                <!-- Page Title -->
                <div class="header-section">
                    <h3 class="page-title">
                        <i class="bi bi-people-fill me-2"></i>Quản lý Người dùng
                    </h3>
                </div>

                <!-- Search and Add Section -->
                <div class="search-add-section">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="searchInput" placeholder="Tìm kiếm theo tên người dùng...">
                            </div>
                        </div>
                        <div class="col-md-6 text-end">
                            <button class="btn btn-primary" onclick="showAddUserModal()">
                                <i class="bi bi-person-plus me-2"></i>Thêm mới
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>STT</th>
                                    <th>Tên người dùng</th>
                                    <th>Vai trò</th>
                                    <th>Ngày tạo</th>
                                    <th width="200">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="5" class="text-center py-4">
                                        <div class="loading-spinner me-2"></div>
                                        Đang tải dữ liệu...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-end mt-4">
                    <nav aria-label="User pagination">
                        <ul class="pagination" id="pagination">
                            <!-- Pagination will be generated here -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Add/Edit User Modal -->
        <div class="modal fade" id="userModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="userModalTitle">Thêm mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="userForm">
                            <input type="hidden" id="userId">
                            <div class="mb-3">
                                <label for="username" class="form-label">Tên người dùng</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3" id="passwordField">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Vai trò</label>
                                <select class="form-select" id="role" required>
                                    <option value="USER">Người dùng</option>
                                    <option value="ADMIN">Quản trị viên</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveUser()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Change Password Modal -->
        <div class="modal fade" id="passwordModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Đổi mật khẩu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="passwordForm">
                            <input type="hidden" id="changePasswordUserId">
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-warning" onclick="changePassword()">Đổi mật khẩu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Delete Confirmation Modal -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-exclamation-triangle text-warning me-2"></i>
                            Xác nhận xóa
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-3">Bạn có chắc chắn muốn xóa người dùng này không?</p>
                        <div class="alert alert-warning">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Lưu ý:</strong> Hành động này không thể hoàn tác!
                        </div>
                        <div id="userToDeleteInfo" class="bg-light p-3 rounded">
                            <!-- User info will be displayed here -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="button" class="btn btn-confirm-delete" id="confirmDeleteBtn">
                            <i class="bi bi-trash me-2"></i>Xóa người dùng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">        
        <script>
            let allUsers = [];
            let filteredUsers = [];
            let currentPage = 1;
            const usersPerPage = 10;
            let userToDeleteId = null;

            // Initialize page
            document.addEventListener('DOMContentLoaded', function() {
                loadUsers();
                setupSearchAndFilter();
            });

            // Load users from API
            async function loadUsers() {
                const accessToken = localStorage.getItem('accessToken');
                
                if (!accessToken) {
                    showAlert('Vui lòng đăng nhập để xem danh sách người dùng.', 'warning');
                    setTimeout(() => window.location.href = '/login', 2000);
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8080/api/v1/users', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        }
                    });

                    if (response.ok) {
                        const apiResult = await response.json();
                        if (apiResult.status && apiResult.data) {
                            allUsers = apiResult.data;
                            filteredUsers = [...allUsers];
                            renderUsers();
                            renderPagination();
                        } else {
                            // Sử dụng userMessage từ API thay vì thông báo cố định
                            showAlert(apiResult.userMessage || apiResult.message || 'Không có dữ liệu người dùng', 'info');
                            
                        }
                    } else {
                        await handleErrorResponse(response);
                    }
                } catch (error) {
                    console.error('Error loading users:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            // Render users table
            function renderUsers() {
                const userTableBody = document.getElementById('userTableBody');
                const startIndex = (currentPage - 1) * usersPerPage;
                const endIndex = startIndex + usersPerPage;
                const currentUsers = filteredUsers.slice(startIndex, endIndex);

                if (currentUsers.length === 0) {
                    userTableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                <i class="bi bi-inbox text-muted" style="font-size: 2rem;"></i>
                                <p class="text-muted mt-2">Không có người dùng nào</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                userTableBody.innerHTML = currentUsers.map((user, index) => `
                    <tr>
                        <td>${startIndex + index + 1}</td>
                        <td>
                            <div>
                                <strong>${user.username}</strong>
                            </div>
                        </td>
                        <td>
                            <span class="badge ${getRoleBadgeClass(user.role)} badge-role">
                                ${getRoleDisplayName(user.role)}
                            </span>
                        </td>
                        <td>${formatDate(user.createdDate)}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editUser(${user.id})" title="Chỉnh sửa">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="action-btn btn-password" onclick="showChangePasswordModal(${user.id})" title="Đổi mật khẩu">
                                <i class="bi bi-key"></i>
                            </button>
                            <button class="action-btn btn-delete" onclick="showDeleteConfirmModal(${user.id})" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            // Helper functions
            function getRoleBadgeClass(role) {
                const classes = {
                    'ADMIN': 'bg-danger',
                    'USER': 'bg-primary'
                };
                return classes[role] || 'bg-secondary';
            }

            function getRoleDisplayName(role) {
                const names = {
                    'ADMIN': 'Quản trị viên',
                    'USER': 'Người dùng'
                };
                return names[role] || role;
            }

            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                try {
                    return new Date(dateString).toLocaleDateString('vi-VN');
                } catch (error) {
                    return dateString;
                }
            }

            // Search and filter
            function setupSearchAndFilter() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', filterUsers);
            }

            function filterUsers() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();

                filteredUsers = allUsers.filter(user => {
                    const matchesSearch = user.username.toLowerCase().includes(searchTerm);
                    return matchesSearch;
                });

                currentPage = 1;
                renderUsers();
                renderPagination();
            }

            // Pagination
            function renderPagination() {
                const totalPages = Math.ceil(filteredUsers.length / usersPerPage);
                const pagination = document.getElementById('pagination');

                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                let paginationHTML = '';
                
                // Previous button
                if (currentPage > 1) {
                    paginationHTML += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Trước</a></li>`;
                }

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        paginationHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                    } else {
                        paginationHTML += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${i})">${i}</a></li>`;
                    }
                }

                // Next button
                if (currentPage < totalPages) {
                    paginationHTML += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Sau</a></li>`;
                }

                pagination.innerHTML = paginationHTML;
            }

            function goToPage(page) {
                currentPage = page;
                renderUsers();
                renderPagination();
            }

            // Modal functions
            function showAddUserModal() {
                document.getElementById('userModalTitle').textContent = 'Thêm người dùng mới';
                document.getElementById('userForm').reset();
                document.getElementById('userId').value = '';
                document.getElementById('passwordField').style.display = 'block';
                document.getElementById('password').required = true;
                new bootstrap.Modal(document.getElementById('userModal')).show();
            }

            function editUser(userId) {
                const user = allUsers.find(u => u.id === userId);
                if (!user) return;

                document.getElementById('userModalTitle').textContent = 'Chỉnh sửa người dùng';
                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('role').value = user.role;
                document.getElementById('passwordField').style.display = 'none';
                document.getElementById('password').required = false;
                
                new bootstrap.Modal(document.getElementById('userModal')).show();
            }

            function showChangePasswordModal(userId) {
                document.getElementById('changePasswordUserId').value = userId;
                document.getElementById('passwordForm').reset();
                new bootstrap.Modal(document.getElementById('passwordModal')).show();
            }

            // Custom delete confirmation modal
            function showDeleteConfirmModal(userId) {
                const user = allUsers.find(u => u.id === userId);
                if (!user) return;

                userToDeleteId = userId;
                
                // Update user info in modal
                document.getElementById('userToDeleteInfo').innerHTML = `
                    <strong>Tên người dùng:</strong> ${user.username}<br>
                    <strong>Vai trò:</strong> ${getRoleDisplayName(user.role)}<br>
                    <strong>Ngày tạo:</strong> ${formatDate(user.createdDate)}
                `;

                // Setup confirm button click handler
                document.getElementById('confirmDeleteBtn').onclick = function() {
                    performDeleteUser(userToDeleteId);
                };

                new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
            }

            // API functions - UPDATED to use userMessage from API
            async function saveUser() {
                const userId = document.getElementById('userId').value;
                const isEdit = !!userId;
                
                const userData = {
                    username: document.getElementById('username').value,
                    role: document.getElementById('role').value
                };

                if (!isEdit) {
                    userData.password = document.getElementById('password').value;
                }

                try {
                    const url = isEdit ? `http://localhost:8080/api/v1/users/${userId}` : 'http://localhost:8080/api/v1/users';
                    const method = isEdit ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        },
                        body: JSON.stringify(userData)
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        // Sử dụng userMessage từ API response
                        showAlert(apiResult.userMessage, 'success');
                        bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                        loadUsers();
                    } else {
                        // Sử dụng userMessage từ API error response
                        showAlert(apiResult.userMessage, 'danger');
                    }
                } catch (error) {
                    console.error('Error saving user:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            async function performDeleteUser(userId) {
                try {
                    const response = await fetch(`http://localhost:8080/api/v1/users/${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        }
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        // Sử dụng userMessage từ API response
                        showAlert(apiResult.userMessage, 'success');
                        bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                        loadUsers();
                    } else {
                        // Sử dụng userMessage từ API error response
                        showAlert(apiResult.userMessage || 'Không thể xóa người dùng', 'danger');
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            // UPDATED: Change Password Function - sử dụng userMessage từ API
            async function changePassword() {
                const userId = document.getElementById('changePasswordUserId').value;
                const newPassword = document.getElementById('newPassword').value;
                
                try {
                    const response = await fetch(`http://localhost:8080/api/v1/users/${userId}/change-password`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                        },
                        body: JSON.stringify({ newPassword: newPassword })
                    });

                    const apiResult = await response.json();

                    if (response.ok) {
                        // Sử dụng userMessage từ API response
                        showAlert(apiResult.userMessage, 'success');
                        bootstrap.Modal.getInstance(document.getElementById('passwordModal')).hide();
                    } else {
                        // Sử dụng userMessage từ API error response
                        showAlert(apiResult.userMessage, 'danger');
                    }
                } catch (error) {
                    console.error('Error changing password:', error);
                    showAlert('Không thể kết nối đến server', 'danger');
                }
            }

            function refreshUserList() {
                document.getElementById('searchInput').value = '';
                loadUsers();
            }

            // Utility functions
            function showAlert(message, type) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
                alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                document.body.appendChild(alertDiv);

                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 5000);
            }

            // UPDATED: handleErrorResponse để sử dụng userMessage từ API
            async function handleErrorResponse(response) {
                let errorData = { message: 'Lỗi không xác định' };
                
                try {
                    errorData = await response.json();
                } catch (e) {
                    console.log('Could not parse error response');
                }

                switch (response.status) {
                    case 401:
                        localStorage.removeItem('accessToken');
                        showAlert(errorData.userMessage || errorData.message || 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'warning');
                        setTimeout(() => window.location.href = '/login', 2000);
                        break;
                    case 403:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Bạn không có quyền truy cập.', 'danger');
                        break;
                    case 404:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'API endpoint không tồn tại.', 'danger');
                        break;
                    case 500:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Lỗi server nội bộ.', 'danger');
                        break;
                    default:
                        showAlert(`Lỗi truy cập: ${errorData.userMessage}` || 'Có lỗi xảy ra', 'danger');
                }
            }
        </script>
    </th:block>
</body>
</html>
